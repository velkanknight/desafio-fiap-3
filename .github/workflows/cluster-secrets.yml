# ============================================================
# PIPELINE: APLICA OS SECRETS SENSÍVEIS NO CLUSTER (Passo 6)
#
# Roda SÓ manualmente (workflow_dispatch), depois que a infra existe.
# Substitui o passo manual do README ("preencha secrets.example.yaml e
# kubectl apply") — útil porque o cluster está em modo CONFIG_MAP e a
# única identidade com acesso kubectl é a role que a pipeline assume.
#
# COMO OS VALORES CHEGAM AQUI SEM VAZAR:
#   - Senha do banco / master keys: vêm de GitHub Secrets, nunca são
#     ecoadas (kubectl create secret não imprime o valor).
#   - Endpoints de RDS/Redis: lidos ao vivo do `terraform output` (não
#     são sensíveis sozinhos).
#   - O ArgoCD deste projeto NÃO gerencia Secrets — só o que está em
#     gitops/. Estes Secrets vivem só no cluster, aplicados por aqui.
#
# SECRETS DO GITHUB necessários (Settings > Secrets and variables > Actions):
#   DB_PASSWORD    -> já existe (mesmo do Terraform)
#   MASTER_KEY     -> master key do auth-service
#   SERVICE_API_KEY-> API key que os outros serviços usam pra falar com o auth
# ============================================================
name: Aplica Secrets no cluster

on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  CLUSTER_NAME: togglemaster
  TF_VERSION: "1.10.5"
  K8S_NAMESPACE: togglemaster

jobs:
  apply-secrets:
    name: Aplica Secrets
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instala o Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Autentica na AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_TERRAFORM }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"

      # Lê os endpoints do state e joga em variáveis de ambiente do job
      # (mascaradas — endpoint não é segredo, mas evita ruído no log).
      - name: Lê os outputs do Terraform
        run: |
          {
            echo "RDS_AUTH=$(terraform output -raw rds_auth_endpoint)"
            echo "RDS_FLAG=$(terraform output -raw rds_flag_endpoint)"
            echo "RDS_TARGETING=$(terraform output -raw rds_targeting_endpoint)"
            echo "REDIS_URL=$(terraform output -raw elasticache_redis_url)"
          } >> "$GITHUB_ENV"

      - name: Configura o kubectl pro cluster EKS
        run: aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"

      - name: Cria o namespace
        run: kubectl create namespace "$K8S_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

      # Cada Secret é criado com --dry-run=client | kubectl apply, que é
      # idempotente (recria/atualiza sem erro se já existir) e não ecoa
      # os valores. As senhas vêm do ambiente, nunca da linha de comando.
      - name: auth-service-secrets
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MASTER_KEY: ${{ secrets.MASTER_KEY }}
        run: |
          kubectl create secret generic auth-service-secrets -n "$K8S_NAMESPACE" \
            --from-literal=DATABASE_URL="postgres://toggleadmin:${DB_PASSWORD}@${RDS_AUTH}:5432/auth_db" \
            --from-literal=MASTER_KEY="${MASTER_KEY}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: flag-service-secrets
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          kubectl create secret generic flag-service-secrets -n "$K8S_NAMESPACE" \
            --from-literal=DATABASE_URL="postgres://toggleadmin:${DB_PASSWORD}@${RDS_FLAG}:5432/flag_db" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: targeting-service-secrets
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          kubectl create secret generic targeting-service-secrets -n "$K8S_NAMESPACE" \
            --from-literal=DATABASE_URL="postgres://toggleadmin:${DB_PASSWORD}@${RDS_TARGETING}:5432/targeting_db" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: evaluation-service-secrets
        env:
          SERVICE_API_KEY: ${{ secrets.SERVICE_API_KEY }}
        run: |
          kubectl create secret generic evaluation-service-secrets -n "$K8S_NAMESPACE" \
            --from-literal=REDIS_URL="${REDIS_URL}" \
            --from-literal=SERVICE_API_KEY="${SERVICE_API_KEY}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Confere (só os nomes, sem valores)
        run: kubectl get secrets -n "$K8S_NAMESPACE"
