# ============================================================
# PIPELINE DE INFRAESTRUTURA (Terraform) — camada diferente das
# outras 5 pipelines (.github/workflows/auth-service.yml e etc.):
# aquelas fazem build/test/push de IMAGEM DOCKER de cada
# microsserviço; esta aqui cria/atualiza a INFRAESTRUTURA AWS em si
# (VPC, EKS, RDS, ElastiCache, DynamoDB, SQS, ECR, OIDC, IRSA) rodando
# `terraform plan`/`terraform apply` dentro do runner do GitHub.
#
# PRÉ-REQUISITO — antes do PRIMEIRO push que dispare esta pipeline,
# rode ./scripts/bootstrap.sh UMA VEZ na sua máquina e configure os 3
# Secrets que ele imprime no final (AWS_ROLE_ARN_TERRAFORM,
# TF_STATE_BUCKET, DB_PASSWORD). Sem isso, o job abaixo não consegue
# nem se autenticar na AWS nem achar o bucket do state. Veja o
# README.md, seção "Credenciais da pipeline de Terraform".
#
# Por que essa Role (AWS_ROLE_ARN_TERRAFORM) é DIFERENTE da Role
# usada pelas 5 pipelines de aplicação (AWS_ROLE_ARN)? Porque esta
# aqui precisa de permissão AMPLA (criar VPC, IAM roles, EKS, etc.),
# enquanto aquelas só precisam de permissão para dar push de imagem
# no ECR. Separar as duas segue o princípio de menor privilégio: se
# o token/role de uma pipeline de aplicação vazar, o estrago possível
# é bem menor do que se fosse a role que pode recriar toda a infra.
# ============================================================
name: Terraform Infra CI/CD

on:
  # PR mexendo em terraform/ -> só faz "plan" (mostra o que mudaria,
  # sem aplicar nada), pra revisar antes de fazer merge.
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"

  # push direto em main mexendo em terraform/ -> faz "plan" e, se
  # o plan for bem-sucedido, "apply" de verdade (cria/atualiza a
  # infra real na AWS).
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"

  # Permite disparar manualmente pela aba "Actions" do GitHub (útil
  # pra reaplicar sem precisar de um commit novo, ex: depois de mudar
  # um valor só no terraform.tfvars.example como referência).
  workflow_dispatch: {}

# id-token: write -> obrigatório para o OIDC (a action
# configure-aws-credentials pede um token de identidade ao GitHub e
# troca por credenciais AWS temporárias). Sem essa permissão, o job
# recebe "Credentials could not be loaded" mesmo com o Secret certo.
# pull-requests: write -> só usado pra comentar o resultado do plan
# direto no Pull Request.
permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.10.5" # tem que ser >= 1.10 por causa do use_lockfile no backend.tf

jobs:
  # ------------------------------------------------------------
  # JOB 1: PLAN — roda em todo PR e todo push. Só MOSTRA o que
  # mudaria, não aplica nada. É o jeito seguro de revisar uma
  # mudança de infraestrutura antes dela virar realidade.
  # ------------------------------------------------------------
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instala o Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # Troca o token OIDC do GitHub por credenciais AWS temporárias
      # (minutos de validade) assumindo a Role ampla do bootstrap.
      # Nenhuma access key fica guardada em lugar nenhum.
      - name: Autentica na AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_TERRAFORM }}
          aws-region: ${{ env.AWS_REGION }}

      # -backend-config injeta o nome do bucket (que é específico da
      # SUA conta AWS) sem precisar hardcodar ele em backend.tf — veja
      # o comentário em terraform/backend.tf pra entender por quê.
      - name: Terraform Init
        run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"

      - name: Terraform Validate
        run: terraform validate

      # TF_VAR_db_password: assim o Terraform provider AWS lê a
      # variável "db_password" (definida em variables.tf, sem
      # default) direto do ambiente, sem precisar de um arquivo
      # terraform.tfvars commitado (que exporia a senha no Git).
      - name: Terraform Plan
        id: plan
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        run: terraform plan -no-color -input=false -out=tfplan
        continue-on-error: true

      # Publica o resultado do plan como comentário no PR, pra quem
      # for revisar não precisar abrir os logs do Actions.
      - name: Comenta o plan no Pull Request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Plan
            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            `;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      # O passo "plan" acima usa continue-on-error só pra conseguir
      # capturar o stdout e comentar no PR mesmo se der erro — aqui a
      # gente FALHA o job de verdade se o plan não deu certo, senão um
      # erro de sintaxe passaria batido.
      - name: Falha o job se o plan deu erro
        if: steps.plan.outcome == 'failure'
        run: exit 1

      # Guarda o plano já calculado como artifact, pra o job de apply
      # (se for rodar) usar EXATAMENTE o mesmo plano revisado, em vez
      # de calcular um novo (que poderia já estar desatualizado).
      - name: Upload do plano
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/tfplan
          retention-days: 1

  # ------------------------------------------------------------
  # JOB 2: APPLY — só roda em push na branch main (nunca em PR, pra
  # nenhuma alteração real acontecer antes de revisar/mergear).
  # `environment: production` é o que permite configurar, direto no
  # GitHub (Settings > Environments > production > Required
  # reviewers), uma APROVAÇÃO MANUAL obrigatória antes deste job
  # rodar — recomendado, já que ele cria infraestrutura real e
  # cobrada na sua conta AWS.
  # ------------------------------------------------------------
  apply:
    name: Terraform Apply
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instala o Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Autentica na AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_TERRAFORM }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"

      - name: Baixa o plano gerado no job "plan"
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform

      # Aplica o MESMO plano que foi revisado/aprovado acima, em vez
      # de recalcular um novo — evita "TOCTOU" (a infra real mudar
      # entre o plan e o apply sem ninguém perceber).
      - name: Terraform Apply
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        run: terraform apply -input=false -auto-approve tfplan

      - name: Mostra os outputs
        run: terraform output

      # ----------------------------------------------------------
      # Fecha o ciclo GitOps: pega os valores que só existem DEPOIS
      # do apply (ARNs das IRSA roles, URL da fila SQS) e escreve eles
      # direto no repo togglemaster-gitops, no lugar dos placeholders
      # REPLACE_WITH_TERRAFORM_OUTPUT_*. Mesmo padrão de "sed + commit
      # se houver diff" usado pelas pipelines de aplicação (ver
      # .github/workflows/flag-service.yml) — só que aqui quem muda a
      # tag de imagem são as pipelines de serviço, e quem atualiza
      # estes valores de infraestrutura é esta pipeline.
      #
      # Repare que NENHUM segredo (senha, connection string completa)
      # é escrito aqui — só ARNs de IAM Role e a URL da fila SQS, que
      # não são sensíveis sozinhos. Senhas de banco/Redis continuam
      # indo manualmente via secrets.example.yaml (Passo 5 do README),
      # nunca pelo repositório GitOps.
      # ----------------------------------------------------------
      - name: Atualiza outputs no repositório GitOps
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITOPS_REPO: ${{ vars.GITOPS_REPO || 'togglemaster-gitops' }}
        run: |
          set -euo pipefail

          EVAL_ARN=$(terraform output -raw evaluation_service_role_arn)
          ANALYTICS_ARN=$(terraform output -raw analytics_service_role_arn)
          SQS_URL=$(terraform output -raw sqs_queue_url)

          git clone "https://x-access-token:${GH_PAT}@github.com/${{ github.repository_owner }}/${GITOPS_REPO}.git" gitops-repo
          cd gitops-repo

          sed -i "s|REPLACE_WITH_TERRAFORM_OUTPUT_evaluation_service_role_arn|${EVAL_ARN}|" service-accounts.yaml
          sed -i "s|REPLACE_WITH_TERRAFORM_OUTPUT_analytics_service_role_arn|${ANALYTICS_ARN}|" service-accounts.yaml
          sed -i "s|REPLACE_WITH_TERRAFORM_OUTPUT_sqs_queue_url|${SQS_URL}|" configmap.yaml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add service-accounts.yaml configmap.yaml

          # Só commita/pusha se algo realmente mudou (evita commit
          # vazio toda vez que a pipeline roda com os valores já
          # atualizados de uma execução anterior).
          git diff --staged --quiet || (
            git commit -m "chore: atualiza outputs do terraform (IRSA roles, SQS url) [skip ci]"
            git push
          )
