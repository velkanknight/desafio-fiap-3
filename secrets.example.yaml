# ============================================================
# ATENÇÃO: este arquivo é só um EXEMPLO/REFERÊNCIA.
#
# NÃO faz parte da pasta gitops/ (que vira o repo togglemaster-gitops
# gerenciado pelo ArgoCD) e NUNCA deve ser commitado com valores reais.
# É exatamente o problema que a Fase 3 pede pra resolver: "credenciais
# do banco de dados sendo passadas em arquivos de texto sem segurança".
#
# Depois do `terraform apply`, preencha os valores reais (endpoints do
# RDS/ElastiCache nos outputs) e aplique DIRETO no cluster, sem
# commitar em lugar nenhum:
#
#   kubectl apply -f secrets-reais.yaml
#   rm secrets-reais.yaml
#
# (o ArgoCD não gerencia Secrets neste projeto — só Deployments,
# Services, ConfigMap e ServiceAccounts, que ficam em gitops/)
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secrets
  namespace: togglemaster
stringData:
  DATABASE_URL: "postgres://toggleadmin:SENHA@ENDPOINT_RDS_AUTH:5432/auth_db"
  MASTER_KEY: "defina-uma-master-key-forte"
---
apiVersion: v1
kind: Secret
metadata:
  name: flag-service-secrets
  namespace: togglemaster
stringData:
  DATABASE_URL: "postgres://toggleadmin:SENHA@ENDPOINT_RDS_FLAG:5432/flag_db"
---
apiVersion: v1
kind: Secret
metadata:
  name: targeting-service-secrets
  namespace: togglemaster
stringData:
  DATABASE_URL: "postgres://toggleadmin:SENHA@ENDPOINT_RDS_TARGETING:5432/targeting_db"
---
apiVersion: v1
kind: Secret
metadata:
  name: evaluation-service-secrets
  namespace: togglemaster
stringData:
  REDIS_URL: "redis://ENDPOINT_ELASTICACHE:6379"
  SERVICE_API_KEY: "chave-de-api-criada-via-POST-/admin/keys-no-auth-service"
