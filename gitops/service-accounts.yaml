# ============================================================
# SERVICE ACCOUNTS — é a "identidade" que um Pod usa dentro do
# Kubernetes. Por padrão, uma ServiceAccount não tem NENHUMA
# permissão AWS; a annotation "eks.amazonaws.com/role-arn" é o que
# ativa o IRSA (IAM Role for Service Accounts): ela diz ao EKS
# "quando um Pod usar esta ServiceAccount, injete nele um token que
# pode ser trocado pela IAM Role indicada aqui".
#
# As duas Roles referenciadas abaixo são criadas pelo Terraform
# (módulos irsa_evaluation / irsa_analytics em terraform/main.tf) —
# elas JÁ restringem exatamente o que cada serviço pode fazer
# (evaluation só ENVIA mensagem SQS; analytics LÊ/APAGA da fila e
# ESCREVE no DynamoDB).
#
# auth-service, flag-service e targeting-service NÃO precisam de
# ServiceAccount própria (usam a "default" do namespace) porque não
# chamam nenhuma API da AWS diretamente.
#
# AÇÃO MANUAL NECESSÁRIA: troque os dois placeholders abaixo pelos
# outputs "evaluation_service_role_arn" e "analytics_service_role_arn"
# do Terraform.
# ============================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: evaluation-service   # tem que ser IGUAL ao "service_account_name" usado no módulo irsa_evaluation (terraform/main.tf)
  namespace: togglemaster
  annotations:
    eks.amazonaws.com/role-arn: "REPLACE_WITH_TERRAFORM_OUTPUT_evaluation_service_role_arn"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: analytics-service    # idem, tem que bater com o irsa_analytics
  namespace: togglemaster
  annotations:
    eks.amazonaws.com/role-arn: "REPLACE_WITH_TERRAFORM_OUTPUT_analytics_service_role_arn"
