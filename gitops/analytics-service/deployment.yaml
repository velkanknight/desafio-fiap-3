# ============================================================
# DEPLOYMENT do analytics-service — um WORKER em background: fica
# consumindo a fila SQS (não recebe requisição HTTP de verdade, só
# expõe /health pro Kubernetes monitorar o processo). Assim como o
# evaluation-service, usa IRSA — mas com uma Role DIFERENTE, com
# permissões diferentes (ler/apagar da fila + escrever no DynamoDB,
# em vez de só enviar mensagem).
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: togglemaster
spec:
  replicas: 2
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
    spec:
      # ServiceAccount própria com annotation IRSA -> IAM Role criada
      # pelo módulo irsa_analytics (terraform/main.tf): permissão de
      # sqs:ReceiveMessage/DeleteMessage/GetQueueAttributes +
      # dynamodb:PutItem/GetItem/Scan, só na fila e tabela deste projeto.
      serviceAccountName: analytics-service
      containers:
        - name: analytics-service
          # Atualizado automaticamente pela pipeline (.github/workflows/analytics-service.yml).
          image: SEU_ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/togglemaster/analytics-service:latest
          ports:
            - containerPort: 8005 # só serve o /health; o trabalho de verdade é o worker interno consumindo o SQS

          # Nenhuma variável aqui é sensível (nada de senha/token) —
          # tudo vem do ConfigMap compartilhado. Repare que este
          # serviço NÃO tem Secret próprio (não precisa).
          env:
            - name: PORT
              value: "8005"
            - name: AWS_SQS_URL
              valueFrom:
                configMapKeyRef:
                  name: services-config
                  key: AWS_SQS_URL
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: services-config
                  key: AWS_REGION
            - name: AWS_DYNAMODB_TABLE
              valueFrom:
                configMapKeyRef:
                  name: services-config
                  key: AWS_DYNAMODB_TABLE

          livenessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 5
            periodSeconds: 10

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
