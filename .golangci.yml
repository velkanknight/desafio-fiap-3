# Config compartilhada pelos serviços Go (auth-service, evaluation-service).
# golangci-lint v2 — conjunto default de linters (errcheck, govet,
# ineffassign, staticcheck, unused). Só ajustamos o staticcheck para
# manter as exclusões default de estilo (ST1xxx) E também ignorar SA1019.
version: "2"

linters:
  settings:
    staticcheck:
      # "all" menos as regras de estilo já desligadas por padrão no v2,
      # menos SA1019.
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # SA1019 = "uso de API deprecada". O evaluation-service ainda usa
        # aws-sdk-go v1 (deprecado em jul/2025); migrar pro v2 é trabalho
        # futuro, fora do escopo da Fase 3. O achado continua visível nos
        # relatórios, só não trava o gate de lint.
        - -SA1019
